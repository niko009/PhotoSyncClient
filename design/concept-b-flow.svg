<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2400" viewBox="0 0 1800 2400">
  <defs>
    <style>
      .bg { fill: #f7f3fb; }
      .phone { fill: #fffdfd; stroke: #1c1a22; stroke-width: 6; rx: 40; ry: 40; }
      .panel { fill: #ffffff; stroke: #1c1a22; stroke-width: 4; }
      .accent { fill: #ffcab8; }
      .accent2 { fill: #cde6ff; }
      .accent3 { fill: #d8f0d7; }
      .accent4 { fill: #efe1ff; }
      .ink { fill: #1c1a22; font-family: Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 700; }
      .h1 { font-size: 28px; font-weight: 700; }
      .h2 { font-size: 20px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 13px; }
      .muted { fill: #665f73; font-family: Arial, sans-serif; font-size: 14px; }
      .chip { font-size: 13px; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1800" height="2400"/>
  <text class="ink title" x="90" y="90">PhotoSync Android Concept B</text>
  <text class="muted" x="90" y="120">Gallery-forward. Softer cards, larger media blocks, more lifestyle feel without losing sync status.</text>

