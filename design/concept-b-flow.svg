  <rect class="phone" x="930" y="180" width="360" height="720" rx="38"/>
  <text class="ink h1" x="960" y="235">Queue</text>
  <rect class="accent2" x="955" y="265" width="310" height="108" rx="24"/>
  <text class="ink h2" x="980" y="302">Syncing 4 of 18</text>
  <text class="ink body" x="980" y="330">VID_1014.mp4</text>
  <text class="muted" x="980" y="354">Waiting for final verification</text>
  <rect class="panel" x="955" y="394" width="310" height="74" rx="20"/>
  <rect class="panel" x="955" y="480" width="310" height="74" rx="20"/>
  <rect class="panel" x="955" y="566" width="310" height="74" rx="20"/>
  <rect class="panel" x="955" y="652" width="310" height="74" rx="20"/>
  <text class="ink body" x="980" y="425">Waiting   14 items</text>
  <text class="ink body" x="980" y="511">Paused by rule   Wi-Fi only</text>
  <text class="ink body" x="980" y="597">Failed   3 items need retry</text>
  <text class="ink body" x="980" y="683">Skipped as duplicate   22</text>
  <rect class="panel" x="955" y="748" width="145" height="58" rx="18"/>
  <rect class="panel" x="1120" y="748" width="145" height="58" rx="18"/>
