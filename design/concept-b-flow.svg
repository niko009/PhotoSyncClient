  <text class="ink h2" x="140" y="462">Family</text>
  <text class="muted" x="140" y="488">132 items</text>
  <text class="ink h2" x="305" y="462">Travel</text>
  <text class="muted" x="305" y="488">82 items</text>
  <text class="ink h2" x="140" y="570">Work</text>
  <text class="muted" x="140" y="596">18 waiting</text>
  <text class="ink h2" x="305" y="570">Cleanup</text>
  <text class="muted" x="305" y="596">Free 8.2 GB</text>
  <rect class="accent4" x="115" y="650" width="310" height="98" rx="24"/>
  <text class="ink h2" x="140" y="686">Suggested action</text>
  <text class="ink body" x="140" y="716">Remove uploaded phone copies from Travel</text>
  <rect class="panel" x="115" y="770" width="150" height="58" rx="18"/>
  <rect class="panel" x="275" y="770" width="150" height="58" rx="18"/>
  <text class="ink body" x="158" y="806">Sync now</text>
  <text class="ink body" x="305" y="806">Open queue</text>

  <rect class="phone" x="510" y="180" width="360" height="720" rx="38"/>
  <text class="ink h1" x="540" y="235">Family</text>
  <text class="muted" x="540" y="262">248 items   41 on server only</text>
  <rect class="panel" x="535" y="286" width="310" height="56" rx="18"/>
