  <text class="ink body" x="1157" y="784">Resume</text>

  <rect class="phone" x="1350" y="180" width="360" height="720" rx="38"/>
  <text class="ink h1" x="1380" y="235">Cleanup</text>
  <text class="muted" x="1380" y="262">Only verified items can be changed</text>
  <rect class="accent3" x="1375" y="286" width="310" height="118" rx="24"/>
  <text class="ink h2" x="1400" y="324">You can free 8.2 GB</text>
  <text class="muted" x="1400" y="350">420 items already safe on server</text>
  <rect class="panel" x="1375" y="428" width="310" height="84" rx="20"/>
  <rect class="panel" x="1375" y="528" width="310" height="84" rx="20"/>
  <rect class="panel" x="1375" y="628" width="310" height="84" rx="20"/>
  <text class="ink body" x="1400" y="460">Keep originals on phone</text>
  <text class="ink body" x="1400" y="560">Remove phone copies after backup</text>
  <text class="ink body" x="1400" y="660">Compress uploaded photos</text>
  <rect class="accent" x="1375" y="732" width="310" height="74" rx="20"/>
  <text class="ink body" x="1400" y="764">Preview-only items remain visible in app</text>
  <text class="muted" x="1400" y="788">Original will no longer be stored locally</text>
