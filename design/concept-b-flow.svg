  <rect class="accent2" x="700" y="366" width="145" height="165" rx="24"/>
  <rect class="accent4" x="535" y="548" width="145" height="165" rx="24"/>
  <rect class="accent" x="700" y="548" width="145" height="165" rx="24"/>
