name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test server/PhotoSync.Server.slnx --configuration Release

  android:
    name: Android checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Unit tests, lint, and unsigned release compilation
        run: ./gradlew :android:app:testDebugUnitTest :android:app:lintRelease :android:app:assembleRelease
      # This proves that the release variant builds. It is deliberately not a
      # distributable APK: release signing material never enters ordinary CI.
      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@v4
        with:
          name: photosync-release-unsigned
          path: android/app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 7
