name: Android build verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Run Android unit tests
        run: ./gradlew --no-daemon :android:app:testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon :android:app:assembleDebug
      - name: Upload debug APK verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: photosync-android-0.4.0-beta-debug-verification
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
