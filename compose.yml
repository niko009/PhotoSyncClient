# Single-instance beta at photosync.bacus.dev. Portal credentials are provisioned privately.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_ENVIRONMENT: Production
      PhotoSync__ServerName: Bacus Lab PhotoSync
      # Media files live on the Windows-backed VirtualBox shared folder.
      # The host path /mnt/server is bind-mounted to /storage below.
      PhotoSync__StorageRoot: /storage
      # Keep SQLite on the native Docker volume rather than the shared folder.
      PhotoSync__DatabasePath: /data/system/photosync.db
      ConnectionStrings__PhotoSync: Data Source=/data/system/photosync.db
      PhotoSync__MaxStorageBytes: "10737418240"
      PhotoSync__MaxFileBytes: "26214400"
      PhotoSync__RequestLogging__Enabled: "true"
      PhotoSync__RequestLogging__Directory: /data/logs
      # Public OAuth audience used for server-side Google ID-token validation.
      GoogleAuth__ClientId: 221018828266-g4jt660ltqoaf2oniuolc82i3m1mpoee.apps.googleusercontent.com
      Portal__PublicOrigin: https://photosync.bacus.dev
    # Provision privately on Ubuntu; never commit this file or its contents.
    env_file:
      - path: /srv/bacus/apps/photosync/portal.env
        required: false
    volumes:
      # Native Docker volume for SQLite and other server-internal state.
      - photosync-data:/data
      # Windows folder mounted in Ubuntu through VirtualBox Shared Folders.
      - /mnt/server:/storage
    # /mnt/server is mounted as gid=1000 on the Bacus Ubuntu host. The app
    # remains non-root but receives that group as a supplementary group.
    group_add:
      - "${PHOTOSYNC_STORAGE_GID:-1000}"
    # Only the Bacus reverse proxy should reach this port; no host port binding.
    expose:
      - "8080"
    networks:
      bacus-net:
        aliases:
          - bacus-photosync
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  photosync-data:
    name: bacus-photosync-data

networks:
  bacus-net:
    external: true
